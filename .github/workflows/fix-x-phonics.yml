name: ABC QUEST - Fix only the X phonics sound

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-x-phonics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  x-phonics:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout ABC QUEST code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio signal analysis
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg numpy

      - name: Retrieve 25 approved sounds and Fox MP3 (no new calls)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p approved-round2
          gh run download 39071909920 \
            --repo "${{ github.repository }}" \
            --name ABC_QUEST_PHONICS_SHORTER_CROPS_ROUND2 \
            --dir approved-round2
          test -s approved-round2/recommended/B.mp3
          test -s approved-round2/recommended/Z.mp3
          test -s approved-round2/words/fox.mp3

      - name: Isolate /ks/ from Fox Box Six and X-ray
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ElevenLabs API secret unavailable."
            exit 1
          fi
          python voice/fix_x_from_word_sibilance.py \
            --approved approved-round2 \
            --out x-phonics-test
          test "$(find x-phonics-test/approved_25 -name '*.mp3' | wc -l)" -eq 25
          test "$(find x-phonics-test/candidates -name '*.mp3' | wc -l)" -eq 8
          test -s x-phonics-test/LISTEN_X_FROM_BOX_SIX_FOX_XRAY.html

      - name: Publish Android listener, all 25 approved sounds, and 8 X candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_X_SOUND_FIX_TEST
          path: x-phonics-test/
          if-no-files-found: warn
          retention-days: 20
