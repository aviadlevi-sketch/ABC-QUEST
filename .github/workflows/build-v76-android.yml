name: Build ABC QUEST 7.6.6 - 30-day login rewards and daily mission chest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v76-android.yml'
      - 'android-patches/v76_gameplay.js'
      - 'android-patches/offline-audio-v76.js'
      - 'android-patches/economy-v76.css'
      - 'android-patches/build_v76_source.py'
      - 'android-patches/reading-v764.js'
      - 'android-patches/reading-v764.css'
      - 'tests/verified-reading-v764.cjs'
      - 'android-patches/rewards-v766.js'
      - 'android-patches/rewards-v766.css'
      - 'tests/rewards-v766.cjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source, scripts and original game
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Retrieve approved 26 spoken letter names (method B)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio-input/names
          gh run download 39068236319 \
            --repo "${{ github.repository }}" \
            --name ABC_QUEST_26_LETTER_NAMES_ZEBRA_APPROVAL \
            --dir audio-input/names
          test "$(find audio-input/names/names -name '*.mp3' | wc -l)" -eq 26

      - name: Retrieve approved 26 phonemes including original X
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio-input/phonemes
          gh run download 39072546611 \
            --repo "${{ github.repository }}" \
            --name ABC_QUEST_FINAL_26_PHONEMES_ORIGINAL_X \
            --dir audio-input/phonemes
          test "$(find audio-input/phonemes/phonemes -name '*.mp3' | wc -l)" -eq 26

      - name: Retrieve approved 156 vocabulary clips in voice 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio-input/words
          gh run download 39072833273 \
            --repo "${{ github.repository }}" \
            --name ABC_QUEST_COMPLETE_156_WORDS_VOICE2 \
            --dir audio-input/words
          test "$(find audio-input/words/words -name '*.mp3' | wc -l)" -eq 156

      - name: Package 7.6.6 Android project and all local speech
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ABC_QUEST_Android_v75_*.zip' -print -quit)"
          test -n "$ZIP"
          python android-patches/build_v76_source.py \
            --source-zip "$ZIP" \
            --project-output "${RUNNER_TEMP}/abcquest-v76" \
            --patches "$GITHUB_WORKSPACE/android-patches" \
            --names "$GITHUB_WORKSPACE/audio-input/names" \
            --phonemes "$GITHUB_WORKSPACE/audio-input/phonemes" \
            --words "$GITHUB_WORKSPACE/audio-input/words"
          ROOT="$(cat "${RUNNER_TEMP}/abcquest-v76/build_root.txt")"
          echo "ABCQUEST_ANDROID_DIR=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/app/src/main/assets/audio/manifest.js"
          test "$(find "$ROOT/app/src/main/assets/audio" -name '*.mp3' | wc -l)" -eq 208

      - name: Validate local audio manifest and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ABCQUEST_ANDROID_DIR"
          node --check "$ROOT/app/src/main/assets/offline-audio.js"
          node --check "$ROOT/app/src/main/assets/adventure_v73.js"
          node tests/verified-reading-v764.cjs
          node tests/rewards-v766.cjs
          grep -q "ABCQuestRewards766" "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -q "rewards:'אוצר הפרסים'" "$ROOT/app/src/main/assets/index.html"
          test -s "$ROOT/app/src/main/assets/rewards_v766.css"
          grep -q "ABCQuestVerifiedReading764" "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -Fq 'מסע של 30 ימי תרגול' "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -Fq 'מתוך 30 במסע' "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -Fq 'read764-controls' "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -q "new JSONArray()" "$ROOT/app/src/main/java/com/abcquest/kids/MainActivity.java"
          grep -q "notifySpeechUnavailable" "$ROOT/app/src/main/java/com/abcquest/kids/MainActivity.java"
          node -e 'const fs=require("fs"),vm=require("vm");const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync(process.argv[1],"utf8"),c);const a=c.window.ABC_QUEST_AUDIO;if(Object.keys(a.names).length!==26||Object.keys(a.phonemes).length!==26||Object.keys(a.words).length!==155)throw Error("audio manifest count mismatch");console.log("Names 26; phonemes 26; unique word playback IDs 155")' "$ROOT/app/src/main/assets/audio/manifest.js"
          grep -q "versionName '7.6.6-preview'" "$ROOT/app/build.gradle"
          grep -q "versionCode 19" "$ROOT/app/build.gradle"
          grep -q "economyVersion!==75 && progress.economyVersion!==76" "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -q "EXACT_HERO_PRICES_762" "$ROOT/app/src/main/assets/adventure_v73.js"
          grep -q "WORLD_SKIN_DISCOUNTS_763" "$ROOT/app/src/main/assets/adventure_v73.js"
          node - "$ROOT/app/src/main/assets/adventure_v73.js" <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=process.argv[2];
          const source=fs.readFileSync(path,'utf8');
          const arraySource=source.match(/const SKIN_CREDIT_PRICES=(\[\[[^;]+\]\]);/);
          if(!arraySource)throw Error('Missing source skin prices');
          const original=JSON.parse(arraySource[1]);
          const context={
            SKIN_CREDIT_PRICES:original,
            HERO_CREDIT_PRICES:[[0,80,160,260],[0,100,200,340],[0,120,250,420],[0,150,300,520]],
            HERO_TROPHY_GATES:[[0,400,1200,2400],[0,3000,4300,5700],[0,6900,8200,9800],[0,11500,13100,15500]]
          };
          vm.createContext(context);
          const beginning=source.indexOf('const baseHeroCredits =');
          const ending=source.indexOf('// The first hero',beginning);
          if(beginning<0||ending<0)throw Error('Pricing formula not found');
          vm.runInContext(source.slice(beginning,ending),context);
          const expected=[
            [0,600,1125,2813],
            [0,900,1688,4125],
            [0,1250,1625,3750],
            [0,1750,2250,5500]
          ];
          if(JSON.stringify(context.SKIN_CREDIT_PRICES)!==JSON.stringify(expected)){
            throw Error('Wrong skin prices. Found '+JSON.stringify(context.SKIN_CREDIT_PRICES));
          }
          console.log('Skin prices verified for all four worlds:',JSON.stringify(expected));
          NODE
          grep -q "progress.questClaimedHeroes.alpha=true" "$ROOT/app/src/main/assets/index.html"

      - name: Build signed Android 7.6.6 debug APK for on-device validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$ABCQUEST_ANDROID_DIR"
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish installable 7.6.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_6_6_30_DAY_REWARD_BOARD_APK
          path: ${{ env.ABCQUEST_ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preserve source code and 208 local audio clips for later edits
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$ABCQUEST_ANDROID_DIR")"
          zip -qr "$GITHUB_WORKSPACE/ABC_QUEST_Android_v766_FULL_SOURCE.zip" "$(basename "$ABCQUEST_ANDROID_DIR")"
          test -s "$GITHUB_WORKSPACE/ABC_QUEST_Android_v766_FULL_SOURCE.zip"

      - name: Publish editable Android source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_6_6_FULL_SOURCE
          path: ABC_QUEST_Android_v766_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 30
