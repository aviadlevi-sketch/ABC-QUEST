name: Build ABC QUEST Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate and extract ABC QUEST project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ] && [ -f settings.gradle ]; then
            echo "Android project is already at repository root."
          elif [ -f ABC_QUEST_Android_v7/app/build.gradle ]; then
            cp -a ABC_QUEST_Android_v7/. .
          else
            ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "::error::Upload the Android project ZIP to the repository root."
              exit 1
            fi
            echo "Using Android project archive: $ZIP"
            mkdir -p /tmp/abcquest-source
            unzip -q "$ZIP" -d /tmp/abcquest-source
            PROJECT="$(find /tmp/abcquest-source -type f -name settings.gradle -print -quit)"
            if [ -z "$PROJECT" ]; then
              echo "::error::Archive does not contain settings.gradle"
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PROJECT")"
            cp -a "$PROJECT_DIR"/. .
          fi
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          echo "ABC QUEST source is ready."

      - name: Apply mobile touch scrolling and immersive Android fixes
        shell: bash
        run: |
          set -euo pipefail
          cp android-patches/MainActivity.java app/src/main/java/com/abcquest/kids/MainActivity.java
          cp android-patches/mobile-fixes.css app/src/main/assets/mobile-fixes.css
          cp android-patches/offline-audio.js app/src/main/assets/offline-audio.js
          # Bundle human female voice recordings when provided in android-audio/.
          mkdir -p app/src/main/assets/audio
          if [ -d android-audio ]; then
            cp -a android-audio/. app/src/main/assets/audio/
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          assets = Path("app/src/main/assets")
          audio = assets / "audio"
          manifest = {}
          for category in ("names", "phonemes", "words"):
              folder = audio / category
              mapping = {}
              if folder.exists():
                  for file in folder.iterdir():
                      if file.is_file() and file.suffix.lower() in (".mp3", ".ogg", ".m4a", ".wav"):
                          name = file.stem.upper() if category != "words" else file.stem.lower()
                          mapping[name] = f"audio/{category}/{file.name}"
              manifest[category] = mapping
          (audio / "manifest.js").write_text(
              "window.ABC_QUEST_AUDIO=" + json.dumps(manifest, ensure_ascii=False) + ";",
              encoding="utf-8")
          html_path = assets / "index.html"
          html = html_path.read_text(encoding="utf-8")
          html = html.replace("</head>", '<link rel="stylesheet" href="mobile-fixes.css"></head>', 1)
          html = html.replace("</body>",
              '<script src="audio/manifest.js"></script>'
              '<script src="offline-audio.js"></script></body>', 1)
          html_path.write_text(html, encoding="utf-8")
          print("Prepared recordings:", {key: len(value) for key,value in manifest.items()})
          PY
          sed -i 's/versionCode 7/versionCode 8/' app/build.gradle
          sed -i "s/versionName '7.0'/versionName '7.1'/" app/build.gradle

      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK for Android
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
