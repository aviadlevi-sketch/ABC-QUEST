name: Build ABC QUEST Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Locate and extract ABC QUEST project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ] && [ -f settings.gradle ]; then
            echo "Android project is at repository root."
          elif [ -f ABC_QUEST_Android_v7/app/build.gradle ]; then
            cp -a ABC_QUEST_Android_v7/. .
          else
            ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "::error::Upload the Android project ZIP to the repository root."
              exit 1
            fi
            echo "Using project archive: $ZIP"
            mkdir -p /tmp/abcquest-source
            unzip -q "$ZIP" -d /tmp/abcquest-source
            PROJECT="$(find /tmp/abcquest-source -type f -name settings.gradle -print -quit)"
            if [ -z "$PROJECT" ]; then
              echo "::error::Archive does not contain settings.gradle"
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PROJECT")"
            cp -a "$PROJECT_DIR"/. .
          fi
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          echo "ABC QUEST source is ready."
      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
