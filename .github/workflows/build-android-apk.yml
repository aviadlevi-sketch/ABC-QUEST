name: Build ABC QUEST Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ABC_QUEST_Android_v75_*.zip'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract latest ABC QUEST v7.5 Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ABC_QUEST_Android_v75_*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::Please upload the complete v7.5 Android project ZIP to the repository root."
            exit 1
          fi
          mkdir -p /tmp/abcquest-v75
          unzip -q "$ZIP" -d /tmp/abcquest-v75
          PROJECT="$(find /tmp/abcquest-v75 -type f -name settings.gradle -print -quit)"
          test -n "$PROJECT"
          cp -a "$(dirname "$PROJECT")"/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/economy_v75.css
          test -f app/src/main/assets/branding/abc_quest_logo.webp
          test -f app/src/main/res/drawable-nodpi/abc_quest_icon.png
          test -f app/abcquest-test.keystore
          grep -q "versionName '7.5-preview'" app/build.gradle
          grep -q "const FAME_TROPHIES=" app/src/main/assets/adventure_v73.js
          echo "ABC QUEST 7.5 validated"

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Android installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_5_TEST_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
