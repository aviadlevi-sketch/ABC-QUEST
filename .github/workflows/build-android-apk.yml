name: Build ABC QUEST Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ABC_QUEST_Android_v75_*.zip'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract uploaded 7.5 game
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ABC_QUEST_Android_v75_*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::Upload ABC_QUEST_Android_v75_להעלאה_GitHub.zip to the repository root."
            exit 1
          fi
          mkdir -p /tmp/abc-quest-android-v75
          unzip -q "$ZIP" -d /tmp/abc-quest-android-v75
          PROJECT="$(find /tmp/abc-quest-android-v75 -type f -name settings.gradle -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::No Android project was found inside the archive."
            exit 1
          fi
          cp -a "$(dirname "$PROJECT")"/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/economy_v75.css
          test -f app/src/main/assets/branding/abc_quest_logo.webp
          test -f app/src/main/assets/adventure_v73.js
          test -f app/abcquest-test.keystore
          test "$(find app/src/main/assets/images -name '*.jpg' | wc -l)" -eq 64
          grep -q "versionName '7.5-preview'" app/build.gradle
          echo "Version 7.5 source, 64 skins, branding, and test signing key verified."

      - name: Build signed debug APK for local Android tests
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_5_TEST_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
