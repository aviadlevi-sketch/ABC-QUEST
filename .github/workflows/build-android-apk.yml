name: Build ABC QUEST Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ABC_QUEST_Android_v73_*.zip'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ABC QUEST 7.3 Android preview
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ABC_QUEST_Android_v73_*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::Please upload ABC_QUEST_Android_v73_להעלאה_GitHub.zip to the repository root."
            exit 1
          fi
          mkdir -p /tmp/abc-quest-android-v73
          echo "Extracting $ZIP"
          unzip -q "$ZIP" -d /tmp/abc-quest-android-v73
          PROJECT="$(find /tmp/abc-quest-android-v73 -type f -name settings.gradle -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Archive does not contain an Android Gradle project."
            exit 1
          fi
          cp -a "$(dirname "$PROJECT")"/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/adventure_v73.js
          test -f app/src/main/assets/astra_skins.js
          test -f app/src/main/assets/adventure_v73.css
          test -f app/abcquest-test.keystore
          grep -q "versionName '7.3-preview'" app/build.gradle
          echo "Loaded complete version 7.3. No old patches applied."

      - name: Build signed test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish Android test installer
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_v7_3_TEST_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
