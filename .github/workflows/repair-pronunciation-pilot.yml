name: ABC QUEST - Repair letter pronunciation pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pronunciation-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audio-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download already generated 20 audio trials (no repeat cost)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repaired-audio-test
          gh run download 39066998228 --repo "${{ github.repository }}" \\
            --name ABC_QUEST_LETTER_SOUND_ZEBRA_REPAIR_TEST --dir repaired-audio-test
          test -f repaired-audio-test/sounds/B/ipa.mp3
          test -f repaired-audio-test/zebra/cmu.mp3
          echo "Existing audio archive recovered; only missing clips will be generated"
      - name: Install audio clip support
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Generate corrected name, sound, and zebra trials
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY secret is missing"
            exit 1
          fi
          python voice/repair_pronunciation_pilot.py --out repaired-audio-test
          test -s repaired-audio-test/LISTEN_FIXED_LETTERS_AND_ZEBRA.html
      - name: Upload all trial files to review on Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABC_QUEST_LETTER_SOUND_ZEBRA_REPAIR_TEST
          path: repaired-audio-test/
          if-no-files-found: warn
          retention-days: 14
